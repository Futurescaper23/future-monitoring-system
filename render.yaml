services:
  - type: web
    name: future-monitoring-system
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3080
      - key: ADMIN_PASSWORD
        sync: false
      - key: WORLDTIDES_API_KEY
        sync: false
